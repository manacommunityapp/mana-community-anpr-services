version: '3.9'

services:
  anpr-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: mana-anpr-service
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ./models:/app/models:ro    # Mount model weights
      - ./anpr_events.db:/app/anpr_events.db  # Persist event log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Uncomment to use PostgreSQL instead of SQLite
